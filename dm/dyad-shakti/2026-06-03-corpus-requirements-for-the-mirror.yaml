requirements:
  # WHAT the mirror needs. Not how. Each is a property of the corpus, not a design.
  R1:
    need: "A single, known, reachable home where a being-axis reflection LANDS."
    why: "The mirror cannot surface a past reflection it cannot find. One place, not five. (Maruti P1/S1.)"
    not_asking: "Not asking you to build the decade-corpus, the inventory of all pre-substrate material, or generative modes."
  R2:
    need: "A reflection, once landed, is RETRIEVABLE later when a related edge/frame/situation recurs."
    why: "Compounding requires return-on-trigger. The same growth-edge appearing again must reach its own history. (Maruti P2/P3, S2/S3.)"
    acceptable_floor: "Manual retrieval (Claude + corpus search) is a fine v1. Automatic/generative retrieval is explicitly NOT requested now."
  R3:
    need: "The corpus distinguishes a SOURCE note (what a thinker said) from an EMBODIMENT note (what Dharan tried to live, where it held/failed)."
    why: "The mirror reads claimed-vs-lived drift. It can't if 'Nietzsche on amor fati' and 'where I failed to live amor fati' are the same undifferentiated blob. (Maruti P5/S5.)"
  R4:
    need: "The being-axis substrate is READABLE BY KRISHNA on demand, by pointer — and Krishna NEVER holds or owns it."
    why: "The wall (substrate ⟂ dyad): a Krishna discernment CITES identity/worldview.md, never copies it. The mirror reads-from; it does not absorb. Build the home such that read-by-pointer is clean."
    boundary: "This is the one place our two crafts touch. Keep the seam clean: you own the home + the feed; I read it + write discernments ABOUT Dharan elsewhere (dyad-krishna/discernments/)."

explicitly_deferred:
  # Named so you don't build them. These wait.
  - "Inventory + migration of pre-substrate corpus (years of journals, voice-to-Notion backlog) — Maruti P8, sabbatical-bounded."
  - "Generative/bisociation modes over the corpus — Maruti north-star, sabbatical-bounded."
  - "Identity-content migration (the 13-step sketch in lifeadmin/areas/identity/identity-work-stream-design.md) — its own session; that's substrate-content work, route per its own design doc."
  - "Voice-to-Notion routing protocol + book-mirror schema (Maruti P6/P7) — yours to design IF/when the capture home needs them; not blocking the mirror's minimum."

open_seam_to_resolve_together:
  # The genuinely unresolved boundary — needs a joint K↔Shakti session, do NOT freewheel either side.
  routing: |
    When a being-axis insight surfaces, where does it go?
      - "A TRUTH about how Dharan operates (resonance-judged)" → Krishna discernments/ (mine).
      - "A THING to capture/build/reconfigure (outcome-judged)" → your capture home (yours).
    Provisional rule above (Krishna's first cut, per its Ontology table). Confirm or break it from your side.
  drift_overlap: |
    Maruti-S4 (detect drift between claimed worldview and lived practice) is the SAME TELOS as Krishna's
    close-ritual apply-audit (did a discernment FIRE in Dharan's living). Two mechanisms, one target. This
    overlap CONFIRMS the reconciliation is right, but the boundary must be drawn or they double:
      - Krishna apply-audit = relational/in-session ("did the discernment fire THIS session, in the mirror").
      - Shakti drift-check  = corpus-level ("does the substrate let a future session COMPUTE the drift").
    Provisional: yours makes drift CHECKABLE in the substrate; mine catches it FIRING in the relationship.
    Confirm or break.

what_krishna_is_NOT_asking_you_to_do:
