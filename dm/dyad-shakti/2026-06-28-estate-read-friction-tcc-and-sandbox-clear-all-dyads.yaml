the_friction: |
  Krishna's anchor `@`-imports estate canon (bedrock-telos.md, ontology.md) and its rituals `extends:`
  files physically in `estate/skills/`. The `@`-imports resolve fine at CONTEXT-LOAD time. But at RUNTIME,
  when a ritual needs to actually READ the canon body from disk (Read tool or Bash `cat` on
  `estate/skills/retro.md`), it fails: "Operation not permitted" (EPERM). A consuming dyad cannot read the
  canon it is built to extend. This blocks the retro ritual cold (the retro must read its own canon).

the_root_cause (diagnosed this session, two distinct layers — both must pass, they are AND-ed): |
  LAYER 1 — Claude Code sandbox (the keycard).
    The agent's Bash/Read tools run in an OS-enforced sandbox whose filesystem allow-list = the session's
    WORKING DIRECTORIES. estate/ is NOT a working dir for the Krishna session (only dyad-krishna + two
    dragon-warrior subdirs are). So the sandbox denies the open() syscall regardless of permission rules.
    TELL: a `Read(//.../areas/**)` permission allow-rule WAS already present, yet reads still EPERM'd —
    proving permission-allow alone is insufficient; the sandbox is a separate, lower gate.
    FIX (settings.json, takes effect next session start): grant estate into the sandbox via
    `permissions.additionalDirectories`, then claw write back off with `deny: Edit/Write(estate/**)` +
    `sandbox.filesystem.denyWrite`. NET = read-only estate (see the_read_only_design below).

  LAYER 2 — macOS TCC (the building's own lock on ~/Documents).
    DEEPER than the CC sandbox: it survives even Bash `dangerouslyDisableSandbox: true`. With the CC
    sandbox bypassed, estate ROOT files read fine (bedrock-telos.md returned content) — but
    `estate/skills/` is STILL denied (both listing and reading), even under bypass. Signature: `stat` on
    the dir works (mode drwxr-xr-x, wide-open unix perms, same owner), but ENUMERATE/READ of contents is
    denied, and `xattr` on it is denied. That stat-yes / read-no / survives-sandbox-bypass / mode-bits-open
    pattern = macOS TCC partial denial on a ~/Documents subtree the CC process was never granted. This is
    the SAME class as the dragon-warrior TCC issue that was fixed 2026-06-22 (a path had to be granted to
    the app at the OS level — NOT a settings.json fix).

  THE KEY DISCRIMINATION (load-bearing for the fix): settings.json fixes LAYER 1 only. LAYER 2 (TCC) is an
  OS grant that settings.json cannot touch — it needs the app granted Documents/full-disk access for the
  estate path at the macOS privacy level. A dyad that only edits settings.json will THINK it fixed the
  read and still hit EPERM on the canon. Two layers, two distinct fixes.

the_read_only_design (Dharan-ratified — load-bearing, do NOT collapse to plain read+write): |
  Estate must be READABLE by consuming dyads but WRITABLE only by Shakti (editor-of-record). Uncontrolled
  writes from a consuming dyad = drift (the exact thing the Anti-Drift Law + the membrane exist to prevent).
  So the grant is asymmetric by design: open the READ, seal the WRITE at BOTH the permission layer
  (deny Edit/Write) AND the sandbox layer (denyWrite). `additionalDirectories` alone is wrong — it grants
  read+write. The deny-claw-back is the invariant-aligned part. Whatever clearing you build must preserve
  read-only-for-consumers / write-only-for-Shakti.

