  1. TAG THIS AS A LEARNING (estate-level — it is estate infra friction every consuming dyad inherits).
     Candidate propagation level: `estate` (all of Dharan's dyads), NOT `form` — it is specific to this
     estate's load-path topology (dyads `@`-import + `extends:` a shared estate tree on ~/Documents).
  2. CLEAR THE FRICTION FOR ALL OF DHARAN'S DYADS (other than Shakti) — every dyad that reads estate canon
     must be able to read it at runtime, read-only, without re-discovering this two-layer gate. That means:
     (a) the settings.json read-only pattern delivered to each consuming dyad (Generator-rendered, like the
