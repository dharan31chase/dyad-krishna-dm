the_finding: |
  While converting Krishna's ritual to the #32 instance mechanism, two estate statements about the
  instance-FILENAME convention conflicted:

    (A) THE REGISTERED MECHANISM (authoritative) — your surface DM (#32) + estate/skills/ritual.md's own
        instance-discipline: a dyad customizes by authoring a `<name>.instance.md` file carrying
        `extends: <canon-path>`. The CANON owns the bare name `ritual.md`; a dyad's instance is a DISTINCT
        file, suffixed `.instance.md`. The suffix IS the legibility mechanism — you can tell canon from
        instance without opening the file (born-conformant / legible, the estate invariant).

    (B) THE WORKED-EXAMPLE ASIDE (now wrong) — estate/skills/ritual.md, ~line 38:
        "Krishna's `ritual.md` and Shakti's `ritual` instance are the worked examples."
        This names Krishna's INSTANCE as `ritual.md` — i.e. the bare canon name, in a different tree.
        That reintroduces the exact same-filename-different-tree ambiguity the .instance.md suffix exists
        to prevent.

  (A) and (B) contradict. Krishna initially anchored on (B) — kept its instance at dyad-root named
  `ritual.md` — and Dharan caught it: "aren't you supposed to do ritual.instance for your ritual skill?
  isn't what the estate canon says?" He's right; (A) is the authority, (B) is a pre-convention aside.

