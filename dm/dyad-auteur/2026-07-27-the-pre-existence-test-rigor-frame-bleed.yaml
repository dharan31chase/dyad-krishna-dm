the_test: |
  DOES THE PROBLEM PRE-EXIST ME, OR DID IT COME INTO EXISTENCE WHEN I SET THE STANDARD?

    - Root-cause work: the problem exists independently of him. It accrues cost whether or not he engages.
      Going at it early is strictly dominant. This is the strength. Keep it.

    - Manufactured prerequisite: nothing is broken until he decides something must be true before he is
      PERMITTED to proceed. The cost does not accrue from the problem — IT ACCRUES FROM THE WAITING.

  THE TELL THAT SEPARATES THEM: preparation has a completion condition; displacement does not. Ask what state
  would tell him it is done, after which he would go. If no such condition can be named, it is not preparation.
  A bar set by the situation is finite. A bar set by a charge re-prices whenever it is approached.

the_live_instance: |
