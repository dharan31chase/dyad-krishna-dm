  first principles, not adopt a conclusion because an expert said it."

  Run the test: where is the problem that already existed? The judgment is not broken. No rupture, nothing
  chronic, nothing that keeps costing him if unaddressed. What exists is a standard he authored.

  And he had already stated the refutation himself, in the same breath: "These are not things that are derived
  a priori — these happen through the act of doing." His record has no competency built before contact —
  teaching by teaching, partnership by a hundred dates, his mother by ten years inside the relationship.

  Note this is A2 from his own being-record inbox (blocker -> prerequisite) appearing in the founder seat.

