the_research_for_your_resources: |
  ASK: please land this in your resources/ tree as a durable artifact. It will matter when the collaboration
  is EVALUATED, not only while it is designed, and Auteur owns the viability call.

  Full graded version (safe to copy wholesale — it is published research, no personal content):
  dragon-warrior/areas/source-notes/family-business-research-india-and-parent-child.md

  The load-bearing findings:

  - INDIAN ENTANGLEMENT IS REAL AND FUNCTIONAL. Indian promoters hold ~50% of listed equity; US founding
    families ~18% (Anderson & Reeb 2003). Family PRESENCE is common in the US; family CONTROL is not. And the
    mechanism matters more than the fact: where capital/labor/contract-enforcement intermediaries are weak,
    the family SUBSTITUTES for the institution (Khanna & Palepu). The entanglement is load-bearing, not
    cultural residue. Removing it removes the working part.

  - THE OVERLAP IS THE ASSET. Three-circle model (Tagiuri & Davis): "bivalent attributes" — shared identity
    and overlapping roles are simultaneously the source of the edge and the pathology. Prescription is role
    clarity, not circle elimination. NOTE: dominant paradigm, but never validated as an INTERVENTION. Do not
    over-invest in it.

  - "FAILS BY GEN 3" IS FALSE. One unreplicated 1987 Illinois study, misquoted by thirty years (it measured
    survival THROUGH the end of gen 2 = 60 years), no counterfactual. Family firms OUTLIVE public companies
    (25,000 US public firms 1950-2009 averaged ~15 years). Do not design against this phantom.

  - THE ONE STRUCTURALLY IDENTIFIED DANGER ZONE IS PARENT-TO-CHILD TRANSFER OF EXECUTIVE AUTHORITY. Family
    successions causally reduce operating profitability by ~4pp (Bennedsen et al., QJE 2007 — rare real
    identification). Villalonga & Amit: family ownership creates value when the FOUNDER is CEO and destroys
    it when a DESCENDANT is CEO. Flagged because Dharan's initial design (he coaches, he sets the bar, he
    decides if she qualifies) put him in the INVERTED form of exactly that seat. That design is now dropped.

  - MONEY RULES BEAT VALUES CHARTERS. The family-constitution provision with actual evidence behind it is
    REMUNERATION. And in India a family constitution is NOT legally binding unless instrumented through
    shareholder agreements, articles, or trust deeds. Indian families score 91% on articulating values and
    15% on robust documentation. The part everyone does has the least evidence.

  - DON'T BOLT ON GOVERNANCE EARLY. Substitution effect: early-stage firms run on self-governance; formal
    structure added prematurely adds cost, not control.

  - FRICTION TRACKS LIFE-STAGE COLLISION, NOT CHARACTER. Davis & Tagiuri (89 dyads): relationship quality is a
    function of the INTERSECTION of both parties' life stages. When both are mid-transition and each one's
    transition threatens the other's, it goes badly — and both parties will reach for character explanations
    and both will be wrong. Naming it in advance is cheap insurance.

  - MOTHER-SON IS A RESEARCH VOID. Fathers and sons: decades. Mothers and sons: near-nothing. Anyone citing
    confident findings here is extrapolating. The one adjacent study (mother/daughter, Italian SMEs) found
    hierarchy becomes "crystallized — neither dynamic nor shared nor even disputed." Set early, then
    unmentionable. That is the failure mode to watch, not a blowup.

  - FOLKLORE, FLAGGED: "family business = 70% of India's GDP" is untraceable (variants 60-79%; the Deloitte
    report it is attributed to contains no such figure). Do not use it. The ownership data makes the same
    point honestly.

what_dharan_decided: |
  For your collaboration-viability call — the mechanics, not the inner work.

  - THE BAR IS DROPPED. The earlier design was: coach her, then she qualifies into partnership against a bar.
    Dropped. October is a two-month working period with NO VERDICT — both report on what it was like to work
    together, neither assesses the other. He arrived at this himself by picturing the failure branch and
    finding it costs nothing: "discuss plainly what ready means for both of us, how to get there, and if
    she's still interested knowing that."

  - HAT-NAMING AS A PER-UTTERANCE LABEL, NOT A DECLARATION. "I'm saying this as your son / as your partner,"
    usable by EITHER of them, in EITHER direction, including as a question ("is that my son or my partner
    talking?"). Built explicitly against the July failure you diagnosed: a DECLARATION has to hold
    continuously and breaks permanently on first violation; a LABEL is per-utterance and cannot break. And it
    KEEPS the mother-son vocabulary rather than ruling it out — which was the deeper defect you identified
    (the frame removed the vocabulary without removing the dynamic).

  - MONEY AND EXIT TERMS WRITTEN BEFORE WORK STARTS. Mutual, both directions, invocable without rupture. This
    is the evidenced move (see research), and it replaces asking her to commit to anything about dependence.
    She has already volunteered an exit unprompted; the move is to write it down and keep it live.

  - PERSONAL CONTENT MID-MEETING GETS HONORED AND MOVED, NOT DEFLECTED. Your two-contents-one-session rule,
    applied. The son-channel already exists, so redirecting is not sending her nowhere — it is sending her to
    the better room. Refusing the COMPRESSION, not the content.

  - THE CONTENTION MECHANISMS (your question #3). Contention cannot be requested from someone whose approval
    is at stake — it has to be structural:
      * Be visibly wrong in front of her, early, and let it cost something. If she never sees him update, she
        has no evidence that contending works.
      * Make her the source where she genuinely knows more (property, the Chennai market, her network) —
        put him in the learner's seat where deference has nowhere to sit.
      * Have her attack THIRD-PARTY proposals first. Builds the muscle without the relational cost.
      * Never ask "what do you think?" right after stating his view. That is the leading-the-witness
        mechanism precisely. Ask before stating, or ask her to argue the opposite case as an exercise.
      * RECEIVE HER NO IN HER REGISTER, NOT HIS. This is the one that decides it. He is planning to teach her
        to falsify — his method, his vocabulary. "Contend with me" can slide into "contend with me in my
        format," which is assimilation, not contention. She may push back by indirection, changing the
        subject, going quiet, or telling a story about someone else. Being able to hear that as a no is a
        harder skill than teaching falsification.

  - ELICITATION VIA MOM-TEST DISCIPLINE. He flagged his own failure mode: leading the witness. So the
    "what do you want to be true in a year" question does NOT get asked directly — people answer hypotheticals
    generously, especially to their children. Instead: ask about the PAST and about SPECIFICS (when did you
    last feel genuinely useful to someone outside the family; describe a week in the last year that felt good;
    what did you do this month you'd be sad to stop doing). He derives the pattern and offers it back AS A
    QUESTION she can reject. Sharpest single question, because it is about a real past decision and cannot be
    answered generously: "what made you say yes when I asked — and what almost made you say no?"

two_asks_back: |
  (a) A CRAFT SKILL HE NAMES AS MISSING — PERSUASION / COURSE-CORRECTION. Routing to you because it is
      founder-craft (holding a room, redirecting without cost), not inner work.

      The situation: in a work session she goes down a rabbit hole. Today his move is to say "I'd rather talk
      about this right now" and move on. It works, and his words are fine — but he reports an UNDERTONE OF
      IMPATIENCE the words do not carry, and he does not have the smoother version. He wants to course-correct
      compassionately, and says plainly he does not know how.

      Why it is worth real craft attention rather than a tip: this is the single most likely place the coach
      hat contaminates the son hat. In a business meeting, pulling someone back from a tangent is competent
      facilitation. From a son to his mother, in the wrong register, it reads as "you are being too much."
      Same behavior, opposite meanings — and the arrangement will manufacture far more occasions for it.

      Krishna keeps the inner half (what the impatience is made of). The SKILL — how to redirect a room
      warmly, at the level of actual technique — is yours.

  (b) HOLD HIS ONE-YEAR FALSIFIABLE CRITERION. He authored it: "at least one project with her that takes me
      to India BETWEEN the annual visits, and I spend that time in Chennai." Binary, dated, un-gameable by the
      work going well — a business that thrives entirely over video is a MISS. Since you own the viability
      call, the criterion for whether the vehicle got built belongs on your side.

      One guard worth carrying with it: as written it is satisfiable by a trip that is entirely meetings,
      which would satisfy the OCCASION and miss the point. Krishna holds the paired read (below). If the trip
      happens and it is all business, that is not a pass — it is a specific finding about the vehicle.

      Timing note: a one-year horizon means the first honest read lands around Aug 2027.

what_krishna_keeps: |
  - THE OCTOBER THICKNESS READ: "do I know more about what is actually going on in her life than I did in
    August?" Occasion and thickness are different goods (his own ratified law: contact and memory-making are
    not the same thing, and only one is what he is missing). Your criterion measures whether the vehicle got
    built; this one measures whether it carries what it was built for.

  - THE LOAD-BEARING-WALL WATCH: five reads he can run without her cooperation — is her world getting bigger
    or smaller (the un-gameable one); are her independent commitments growing or shrinking; is a cancelled
    session proportionate; does she still mention other people she could build with; over ten decisions, how
    many ORIGINATED with her rather than were agreed to. Plus the one that catches him rather than her: does
    it feel good when she needs him.

  - THE IMPATIENCE EDGE, inner half — what the impatience is actually made of, and which hat it is wearing.
    The skill half is ask (a).

  Your side keeps, per your own split: the frame-bleed craft question, the collaboration-viability decision,
  and guarding the founder-judgment slots against an unexamined driver. Noting for your record: the
  driver-mirror you routed was ANSWERED 2026-07-31 — he re-classified the business as "a how" himself,
  unprompted, which is the same move he had made on her third driver. DW-007 in the being-record holds it.
